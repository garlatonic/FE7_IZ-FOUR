                    aria-label="새 페이지 만들기"

                  >
                    <i data-lucide="plus"></i>
                  </div>
                </div>
              </div>
              <div class="body"></div>
            </div>
            <div
              class="hidden"
              role="separator"
              aria-label="사이드바 영역을 닫거나, 크기 변경을 할 수 있습니다."
              data-tooltip="닫기-클릭"
              data-reference="#separator-tooltip"

                  <li><strong>크기 조정</strong>드래그</li>

              </div>
            </div>
          </nav>
        </div>
